<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Usuarios · Panel admin · Morfi Center</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Caveat:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

<!-- Dev: Tailwind CDN + config compartida. Prod: /assets/css/tailwind.css -->
<script src="https://cdn.tailwindcss.com"></script>
<script src="/tailwind.config.js"></script>
<link rel="stylesheet" href="/assets/css/base.css" />
</head>
<body class="font-sans text-bark antialiased">

<!-- Cabecera mínima de admin: sin cart/top-nav de cliente (no aplican acá). -->
<header class="border-b-2 border-bark/10 bg-cream/70 px-5 py-4 lg:px-10">
  <div class="mx-auto flex max-w-[1200px] items-center justify-between">
    <a href="/index.html" class="flex items-center gap-3">
      <span class="blob grid h-9 w-9 place-items-center bg-forest font-display text-sm font-bold text-cream" aria-hidden="true">M</span>
      <span class="leading-none">
        <span class="block font-display text-[15px] font-bold">Morfi Center</span>
        <span class="block text-[11px] uppercase tracking-widest text-bark/40">Panel de administración</span>
      </span>
    </a>
    <div data-session-slot class="flex items-center gap-3 text-[13px] font-medium"></div>
  </div>
</header>

<div class="mx-auto max-w-[1200px] px-5 py-8 lg:px-10">
  <div class="flex flex-wrap items-center justify-between gap-4">
    <div>
      <h1 class="font-display text-[26px] font-bold leading-tight">Usuarios</h1>
      <p class="mt-1 font-hand text-[16px] text-brick">administradores y repartidores</p>
    </div>
    <button type="button" data-toggle-create
            class="blob bg-forest px-6 py-2.5 text-[13px] font-semibold text-cream transition hover:bg-bark">
      + Nuevo usuario
    </button>
  </div>

  <!-- ═══ Panel de alta (oculto por default) ═══ -->
  <div data-create-panel hidden class="mt-6 rounded-2xl border-2 border-bark/12 bg-cream p-5 lg:p-6">
    <h2 class="font-display text-[18px] font-bold">Nuevo ADMIN o DELIVERY</h2>
    <p class="mt-1 text-[12px] text-bark/50">Los clientes se registran solos desde la app — acá solo se da de alta personal.</p>

    <form id="create-form" class="mt-4 grid gap-4 sm:grid-cols-2" novalidate>
      <div>
        <label for="c_first_name" class="mb-1.5 block text-[11px] uppercase tracking-widest text-bark/45">Nombre</label>
        <input id="c_first_name" name="first_name" type="text" required
               class="w-full rounded-xl border-2 border-bark/15 bg-kraft/40 px-4 py-2.5 text-[14px] focus:border-forest focus:outline-none focus:ring-2 focus:ring-forest/15" />
      </div>
      <div>
        <label for="c_last_name" class="mb-1.5 block text-[11px] uppercase tracking-widest text-bark/45">Apellido</label>
        <input id="c_last_name" name="last_name" type="text" required
               class="w-full rounded-xl border-2 border-bark/15 bg-kraft/40 px-4 py-2.5 text-[14px] focus:border-forest focus:outline-none focus:ring-2 focus:ring-forest/15" />
      </div>
      <div>
        <label for="c_email" class="mb-1.5 block text-[11px] uppercase tracking-widest text-bark/45">Email</label>
        <input id="c_email" name="email" type="email" required
               class="w-full rounded-xl border-2 border-bark/15 bg-kraft/40 px-4 py-2.5 text-[14px] focus:border-forest focus:outline-none focus:ring-2 focus:ring-forest/15" />
      </div>
      <div>
        <label for="c_phone" class="mb-1.5 block text-[11px] uppercase tracking-widest text-bark/45">Teléfono <span class="normal-case text-bark/35">(opcional)</span></label>
        <input id="c_phone" name="phone" type="tel"
               class="w-full rounded-xl border-2 border-bark/15 bg-kraft/40 px-4 py-2.5 text-[14px] focus:border-forest focus:outline-none focus:ring-2 focus:ring-forest/15" />
      </div>
      <div>
        <label for="c_role" class="mb-1.5 block text-[11px] uppercase tracking-widest text-bark/45">Rol</label>
        <select id="c_role" name="role" required
                class="w-full rounded-xl border-2 border-bark/15 bg-kraft/40 px-4 py-2.5 text-[14px] focus:border-forest focus:outline-none focus:ring-2 focus:ring-forest/15">
          <option value="ADMIN">Administrador</option>
          <option value="DELIVERY">Repartidor</option>
        </select>
      </div>
      <div>
        <label for="c_password" class="mb-1.5 block text-[11px] uppercase tracking-widest text-bark/45">Contraseña <span class="normal-case text-bark/35">(opcional)</span></label>
        <input id="c_password" name="password" type="text"
               class="w-full rounded-xl border-2 border-bark/15 bg-kraft/40 px-4 py-2.5 text-[14px] focus:border-forest focus:outline-none focus:ring-2 focus:ring-forest/15"
               placeholder="vacío = se genera una" />
      </div>

      <!-- Solo para DELIVERY -->
      <div data-delivery-fields hidden class="sm:col-span-2 grid gap-4 sm:grid-cols-2">
        <div>
          <label for="c_vehicle" class="mb-1.5 block text-[11px] uppercase tracking-widest text-bark/45">Vehículo</label>
          <select id="c_vehicle" name="vehicle_type"
                  class="w-full rounded-xl border-2 border-bark/15 bg-kraft/40 px-4 py-2.5 text-[14px] focus:border-forest focus:outline-none focus:ring-2 focus:ring-forest/15">
            <option value="moto">Moto</option>
            <option value="bici">Bici</option>
            <option value="auto">Auto</option>
            <option value="a_pie">A pie</option>
          </select>
        </div>
        <div>
          <label for="c_capacity" class="mb-1.5 block text-[11px] uppercase tracking-widest text-bark/45">Capacidad (pedidos)</label>
          <input id="c_capacity" name="capacity" type="number" min="1" value="3"
                 class="w-full rounded-xl border-2 border-bark/15 bg-kraft/40 px-4 py-2.5 text-[14px] focus:border-forest focus:outline-none focus:ring-2 focus:ring-forest/15" />
        </div>
      </div>

      <p data-error="create-form" class="hidden rounded-xl border-2 border-brick/30 bg-brick/8 px-4 py-3 text-[13px] text-brick sm:col-span-2" role="alert"></p>
      <p data-success="create-form" class="hidden rounded-xl border-2 border-forest/25 bg-forest/8 px-4 py-3 text-[13px] text-bark/70 sm:col-span-2" role="status"></p>

      <div class="flex items-center gap-3 sm:col-span-2">
        <button type="submit" data-submit-create
                class="blob bg-forest px-6 py-2.5 text-[13px] font-semibold text-cream transition hover:bg-bark disabled:cursor-not-allowed disabled:opacity-60">
          Crear usuario
        </button>
        <button type="button" data-cancel-create
                class="blob border-2 border-bark/20 px-4 py-2 text-[13px] text-bark transition hover:bg-bark hover:text-cream">
          Cancelar
        </button>
      </div>
    </form>
  </div>

  <!-- ═══ Filtro por rol ═══ -->
  <div class="mt-8 flex flex-wrap gap-2">
    <button type="button" data-filter="" class="blob bg-bark px-3.5 py-1.5 text-[12px] font-medium text-cream" aria-pressed="true">Todos</button>
    <button type="button" data-filter="ADMIN" class="blob border-2 border-bark/15 px-3.5 py-1.5 text-[12px] text-bark/60 transition hover:border-bark/40" aria-pressed="false">Admins</button>
    <button type="button" data-filter="CUSTOMER" class="blob border-2 border-bark/15 px-3.5 py-1.5 text-[12px] text-bark/60 transition hover:border-bark/40" aria-pressed="false">Clientes</button>
    <button type="button" data-filter="DELIVERY" class="blob border-2 border-bark/15 px-3.5 py-1.5 text-[12px] text-bark/60 transition hover:border-bark/40" aria-pressed="false">Repartidores</button>
  </div>

  <!-- ═══ Tabla ═══ -->
  <div class="mt-4 overflow-x-auto rounded-2xl border-2 border-bark/12 bg-cream">
    <table class="w-full min-w-[720px] text-left text-[13px]">
      <thead>
        <tr class="border-b-2 border-bark/10 text-[11px] uppercase tracking-widest text-bark/45">
          <th class="px-4 py-3 font-medium">Nombre</th>
          <th class="px-4 py-3 font-medium">Email</th>
          <th class="px-4 py-3 font-medium">Rol</th>
          <th class="px-4 py-3 font-medium">Estado</th>
          <th class="px-4 py-3 font-medium">Acciones</th>
        </tr>
      </thead>
      <tbody data-users-body>
        <tr><td colspan="5" class="px-4 py-6 text-center text-bark/45">Cargando…</td></tr>
      </tbody>
    </table>
  </div>

  <div class="mt-4 flex items-center justify-between text-[12px] text-bark/50">
    <span data-page-info></span>
    <div class="flex gap-2">
      <button type="button" data-prev-page class="blob border-2 border-bark/20 px-3 py-1 transition hover:bg-bark hover:text-cream disabled:cursor-not-allowed disabled:opacity-40">← anterior</button>
      <button type="button" data-next-page class="blob border-2 border-bark/20 px-3 py-1 transition hover:bg-bark hover:text-cream disabled:cursor-not-allowed disabled:opacity-40">siguiente →</button>
    </div>
  </div>
</div>

<script type="module" src="/assets/js/pages/admin-usuarios.js"></script>
</body>
</html>
