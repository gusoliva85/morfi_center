<!doctype html>
<html lang="es-AR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Morfi Center · Sandbox de api.js</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="/tailwind.config.js"></script>
<link rel="stylesheet" href="/assets/css/base.css" />
</head>
<body class="font-sans text-bark antialiased">

<div class="mx-auto max-w-[820px] px-5 py-10">
  <p class="text-[11px] uppercase tracking-widest text-bark/40">Sandbox · api.js</p>
  <h1 class="mt-1 font-display text-[30px] font-bold">Cliente HTTP</h1>
  <p class="mt-2 text-[14px] text-bark/60">
    Requiere el backend corriendo (<code>iniciar.bat</code> o <code>uvicorn app.main:app --port 8000</code>).
  </p>

  <div class="mt-6 space-y-3">
    <div class="rounded-2xl border-2 border-bark/12 bg-cream p-4">
      <div class="text-[11px] uppercase tracking-widest text-bark/40">window.__MC_API__</div>
      <code id="base" class="font-display text-[15px] font-bold"></code>
    </div>
    <button id="run" type="button" class="blob bg-forest px-6 py-2.5 text-[13px] font-semibold text-cream transition hover:bg-bark">
      api.get('/health')
    </button>
    <pre id="out" class="overflow-x-auto rounded-2xl border-2 border-bark/12 bg-cream p-4 text-[13px]"></pre>
  </div>
</div>

<script type="module">
  import { api, ApiError } from "/assets/js/api.js";
  import { API_BASE } from "/assets/js/config.js";

  document.getElementById("base").textContent = API_BASE;
  const out = document.getElementById("out");

  async function run() {
    out.textContent = "cargando…";
    try {
      const data = await api.get("/health");
      out.textContent = "OK  " + JSON.stringify(data, null, 2);
      console.log("api.get('/health') ->", data);
    } catch (err) {
      out.textContent =
        err instanceof ApiError
          ? `ApiError  status=${err.status}  code=${err.code}\n${err.message}`
          : String(err);
      console.error(err);
    }
  }

  document.getElementById("run").addEventListener("click", run);
  run();
</script>
</body>
</html>
