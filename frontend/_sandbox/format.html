<!doctype html>
<html lang="es-AR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Morfi Center · Sandbox de format.js</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="/tailwind.config.js"></script>
<link rel="stylesheet" href="/assets/css/base.css" />
</head>
<body class="font-sans text-bark antialiased">

<div class="mx-auto max-w-[860px] px-5 py-10">
  <p class="text-[11px] uppercase tracking-widest text-bark/40">Sandbox · format.js</p>
  <h1 class="mt-1 font-display text-[30px] font-bold">Helpers de formato</h1>
  <p class="mt-2 text-[14px] text-bark/60">Casos de prueba (también en la consola del navegador). Las filas <span class="text-mustard">info</span> dependen del ICU del navegador y no cuentan como fallo.</p>

  <div id="out" class="mt-6 overflow-hidden rounded-2xl border-2 border-bark/12 bg-cream"></div>
  <p id="summary" class="mt-4 font-display text-[16px] font-bold"></p>
</div>

<script type="module">
  import * as F from "/assets/js/format.js";

  // 2026-09-10 15:00:00 UTC == 12:00 en Buenos Aires
  const D = "2026-09-10T15:00:00Z";

  // [label, valor, esperado, modo]  modo: "eq" (estricto) | "info" (solo muestra)
  const cases = [
    ["formatMoney(3180000)", F.formatMoney(3180000), "$31.800", "eq"],
    ["formatMoney(1000000)", F.formatMoney(1000000), "$10.000", "eq"],
    ["formatMoney(720050)", F.formatMoney(720050), "$7.200,50", "eq"],
    ["formatMoney(0)", F.formatMoney(0), "$0", "eq"],
    ["formatMoney(-1500000)", F.formatMoney(-1500000), "-$15.000", "eq"],
    ["formatMoney(999)", F.formatMoney(999), "$9,99", "eq"],
    ["formatMoney(150000,{cents:'always'})", F.formatMoney(150000, { cents: "always" }), "$1.500,00", "eq"],
    ["formatMoney(150000,{symbol:false})", F.formatMoney(150000, { symbol: false }), "1.500", "eq"],
    ["pad2(5)", F.pad2(5), "05", "eq"],
    ["pad2(42)", F.pad2(42), "42", "eq"],
    ["formatDate(D)", F.formatDate(D), "10/09/2026", "eq"],
    ["formatDate(D,{style:'medium'})", F.formatDate(D, { style: "medium" }), "", "info"],
    ["formatDate(D,{style:'long'})", F.formatDate(D, { style: "long" }), "", "info"],
    ["formatTime(D)", F.formatTime(D), "12:00", "eq"],
    ["formatTime(D,{seconds:true})", F.formatTime(D, { seconds: true }), "12:00:00", "eq"],
    ["formatDuration(6135)", F.formatDuration(6135), "01:42:15", "eq"],
    ["formatDuration(0)", F.formatDuration(0), "00:00:00", "eq"],
    ["formatRelativeTime(now-10s)", F.formatRelativeTime(Date.now() - 10000), "recién", "eq"],
    ["formatRelativeTime(now-180s)", F.formatRelativeTime(Date.now() - 180000), "", "info"],
    ["formatRelativeTime(now-2h)", F.formatRelativeTime(Date.now() - 7200000), "", "info"],
  ];

  let pass = 0;
  let strict = 0;
  const rows = cases
    .map(([label, got, want, mode]) => {
      const isEq = mode === "eq";
      const ok = !isEq || got === want;
      if (isEq) {
        strict++;
        if (ok) pass++;
      }
      const tag = !isEq ? "info" : ok ? "PASS" : "FAIL";
      console[ok ? "log" : "error"](
        `${tag}  ${label}  ->  ${JSON.stringify(got)}` + (isEq && !ok ? `  (esperado ${JSON.stringify(want)})` : ""),
      );
      const mark = !isEq ? '<span class="text-mustard font-bold">·</span>' : ok ? '<span class="text-forest font-bold">✓</span>' : '<span class="text-brick font-bold">✕</span>';
      return `<div class="flex items-center gap-3 border-b-2 border-bark/10 px-4 py-2.5 text-[13px] last:border-0">
        ${mark}
        <code class="flex-1">${label}</code>
        <code class="text-bark/70">${JSON.stringify(got)}</code>
      </div>`;
    })
    .join("");

  document.getElementById("out").innerHTML = rows;
  const all = pass === strict;
  const s = document.getElementById("summary");
  s.textContent = `${pass}/${strict} estrictas OK`;
  s.classList.add(all ? "text-forest" : "text-brick");
</script>
</body>
</html>
