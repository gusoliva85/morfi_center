<div class="flex items-center gap-3">
  <div class="blob grid h-11 w-11 place-items-center bg-forest font-display text-lg font-bold text-cream">M</div>
  <div>
    <div class="font-display text-xl font-bold leading-none">Morfi Center</div>
    <div class="font-hand text-[15px] text-brick">cocina de olla, todos los días</div>
  </div>
</div>
<div data-partial="top-nav"></div>
<!-- Estado de sesión: solo en escritorio (mismo corte que top-nav). En
     mobile, "Cuenta" del bottom-nav ya cumple ese rol — agregar esto acá
     también apretaría un header ya angosto. Nunca oculta el resto del
     header (RN de T-1.11.4): son elementos extra, no un reemplazo. -->
<div class="hidden items-center gap-3 lg:flex" data-session>
  <span class="hidden text-[13px] font-medium text-bark/70" data-session-name></span>
  <button
    class="hidden text-[13px] font-semibold text-brick underline decoration-brick/40 underline-offset-2"
    type="button"
    data-session-logout
  >
    Cerrar sesión
  </button>
  <a
    class="hidden text-[13px] font-semibold text-forest underline decoration-forest/40 underline-offset-2"
    href="/pages/auth/login.html"
    data-session-login
  >
    Ingresar
  </a>
</div>
<div class="flex flex-col items-center gap-1">
  <button class="blob relative grid h-11 w-11 place-items-center bg-bark text-cream" data-cart-toggle aria-label="Ver mi vianda">
    🧺
    <span class="absolute -right-1 -top-1 grid h-5 w-5 place-items-center rounded-full bg-mustard text-[10px] font-bold text-bark" data-cart-count>3</span>
  </button>
  <!-- Countdown chico, solo en mobile: en escritorio el ticket grande del
       home ya cumple ese rol y no tenía el problema de espacio de mobile.
       Estático por ahora, igual que el ticket grande (T-2.4.3, Fase 2, es
       quien conecta los dos a la hora real del turno). -->
  <div
    class="whitespace-nowrap rounded-full border-2 border-brick/30 bg-brick/10 px-2.5 py-0.5 font-display text-[12px] font-bold tabular-nums text-brick lg:hidden"
    data-countdown-chip
  >
    ⏳ 01:42:15
  </div>
</div>
