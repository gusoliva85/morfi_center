<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Entrar · Morfi Center</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Caveat:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<script>
  tailwind.config = { theme: { extend: {
    fontFamily: { display:['Bricolage Grotesque','system-ui','sans-serif'], hand:['Caveat','cursive'], sans:['Inter','system-ui','sans-serif'] },
    colors: { kraft:'#E9DFC9', cream:'#F6EFDD', bark:'#3B2E22', forest:'#2F5D3A', mustard:'#D69A2D', brick:'#B0472F' },
  }}};
</script>
<link rel="stylesheet" href="../../assets/css/base.css" />
</head>
<body class="font-sans text-bark antialiased">

<!-- Pantalla enfocada: sin nav ni carrito. En escritorio no se estira el panel
     (§16.2 prohíbe la card suelta a todo el ancho): queda centrado y acotado. -->
<div class="mx-auto flex min-h-screen max-w-[480px] flex-col justify-center px-3 py-8 sm:px-4">

  <div class="paper relative overflow-hidden rounded-[24px] border border-bark/10 sm:rounded-[34px]">
    <div class="blob pointer-events-none absolute -right-20 -top-24 h-64 w-64 bg-forest/10"></div>
    <div class="blob2 pointer-events-none absolute -bottom-24 -left-16 h-56 w-56 bg-mustard/15"></div>

    <div class="relative px-5 py-7 sm:px-8 sm:py-9">

      <a class="flex items-center gap-3" href="/index.html">
        <div class="blob grid h-11 w-11 place-items-center bg-forest font-display text-lg font-bold text-cream">M</div>
        <div>
          <div class="font-display text-xl font-bold leading-none">Morfi Center</div>
          <div class="font-hand text-[15px] text-brick">cocina de olla, todos los días</div>
        </div>
      </a>

      <h1 class="mt-7 font-display text-[28px] font-bold leading-tight sm:text-[32px]">
        Entrá a tu cuenta
      </h1>
      <p class="mt-2 text-[14px] leading-relaxed text-bark/60">
        Para pedir tu vianda y seguir tus pedidos.
      </p>

      <!-- Mensajes de error: aria-live para que un lector de pantalla los anuncie -->
      <div
        class="mt-5 hidden rounded-xl border-2 border-brick/30 bg-brick/8 px-4 py-3 text-[13px] leading-relaxed text-brick"
        data-error
        role="alert"
        aria-live="polite"
      ></div>

      <form class="mt-6 grid gap-4" data-login-form novalidate>
        <div>
          <label class="block text-[13px] font-semibold" for="email">Email</label>
          <input
            class="mt-1.5 w-full rounded-xl border-2 border-bark/15 bg-cream px-4 py-3 text-[14px] outline-none transition placeholder:text-bark/35 focus:border-forest"
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="tumail@ejemplo.com"
            required
          />
        </div>

        <div>
          <div class="flex items-baseline justify-between gap-3">
            <label class="block text-[13px] font-semibold" for="password">Contraseña</label>
            <a class="text-[12px] font-medium text-brick underline decoration-brick/40 underline-offset-2" href="recuperar.html">
              La olvidé
            </a>
          </div>
          <input
            class="mt-1.5 w-full rounded-xl border-2 border-bark/15 bg-cream px-4 py-3 text-[14px] outline-none transition placeholder:text-bark/35 focus:border-forest"
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="Tu contraseña"
            required
          />
        </div>

        <button
          class="mt-1 rounded-2xl bg-brick px-7 py-3 text-[13px] font-semibold text-cream transition hover:bg-bark disabled:cursor-not-allowed disabled:opacity-60"
          type="submit"
          data-submit
        >
          Iniciar sesión
        </button>
      </form>

      <div class="my-6 flex items-center gap-3 text-[11px] uppercase tracking-[0.2em] text-bark/35">
        <span class="dashed flex-1"></span> o <span class="dashed flex-1"></span>
      </div>

      <button
        class="w-full rounded-2xl border-2 border-bark/20 bg-cream px-6 py-3 text-[13px] font-semibold transition hover:bg-bark hover:text-cream"
        type="button"
        data-google
      >
        Continuar con Google
      </button>
      <!-- Por seguridad el backend no puede decir "esta cuenta entra con
           Google" sin revelar qué emails existen (T-1.4.1), así que el aviso
           tiene que estar fijo en la pantalla. -->
      <p class="mt-2.5 text-center text-[12px] leading-relaxed text-bark/50">
        ¿Te registraste con Google? Entrá con ese botón, no con la contraseña.
      </p>

      <p class="mt-7 border-t border-bark/10 pt-5 text-center text-[13px] text-bark/60">
        ¿Primera vez?
        <a class="font-semibold text-forest underline decoration-forest/40 underline-offset-2" href="registro.html">
          Creá tu cuenta
        </a>
      </p>

    </div>
  </div>

  <a class="mt-5 text-center text-[13px] text-bark/50 hover:text-bark" href="/index.html">
    ← Volver a la olla de hoy
  </a>

</div>

<script type="module" src="../../assets/js/pages/login.js"></script>
</body>
</html>
