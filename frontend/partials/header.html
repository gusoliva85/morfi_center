<!-- Parcial: cabecera (rol cliente). Se inyecta en <div data-partial="header">. -->
<header class="relative flex items-center justify-between px-5 pt-6 lg:px-10 lg:pt-8">
  <a href="/index.html" class="flex items-center gap-3">
    <span class="blob grid h-11 w-11 place-items-center bg-forest font-display text-lg font-bold text-cream" aria-hidden="true">M</span>
    <span class="leading-none">
      <span class="block font-display text-xl font-bold">Morfi Center</span>
      <span class="block font-hand text-[15px] text-brick">cocina de olla, todos los días</span>
    </span>
  </a>

  <!-- Nav de escritorio: se completa con el parcial top-nav -->
  <nav class="hidden items-center gap-7 text-[13px] font-medium text-bark/60 lg:flex" aria-label="Navegación principal" data-partial="top-nav"></nav>

  <!-- Sesión (solo escritorio; en móvil la pestaña "Cuenta" de la bottom nav cumple ese rol).
       Lo pinta mountSessionUI() de auth.js: "Hola, {nombre} · Cerrar sesión" o "Ingresar". -->
  <div data-session-slot class="hidden items-center gap-3 text-[13px] font-medium lg:flex"></div>

  <a href="/pages/cliente/carrito.html"
     class="blob relative grid h-11 w-11 place-items-center bg-bark text-cream transition hover:bg-brick"
     aria-label="Carrito" data-cart-button>
    <span aria-hidden="true">🧺</span>
    <span class="absolute -right-1 -top-1 grid h-5 w-5 place-items-center rounded-full bg-mustard text-[10px] font-bold text-bark"
          data-cart-count hidden>0</span>
  </a>
</header>
