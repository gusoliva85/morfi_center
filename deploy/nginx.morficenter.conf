# Reemplazar <SSLIP_HOSTNAME> por el hostname real (ej. 13-140-36-93.sslip.io)
# antes de copiar este archivo al servidor. Certbot va a editar este mismo
# archivo automáticamente para agregar el bloque HTTPS (puerto 443).
server {
    listen 80;
    server_name <SSLIP_HOSTNAME>;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
