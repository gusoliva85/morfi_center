<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Morfi Center · [Pantalla]</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Caveat:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

<!-- Dev: Tailwind CDN + config compartida.
     Prod: reemplazar las 2 líneas siguientes por <link rel="stylesheet" href="/assets/css/tailwind.css"> -->
<script src="https://cdn.tailwindcss.com"></script>
<script src="/tailwind.config.js"></script>

<link rel="stylesheet" href="/assets/css/base.css" />
</head>
<body class="pb-[84px] font-sans text-bark antialiased lg:pb-0">

<div class="mx-auto max-w-[1200px] px-4 pt-6 lg:py-10">
  <div class="paper relative overflow-hidden rounded-[34px] border border-bark/10">
    <!-- blobs decorativos (opcional): capa clipeada para no romper el redondeo -->
    <div class="pointer-events-none absolute inset-0 overflow-hidden rounded-[34px]">
      <div class="blob absolute -right-24 -top-24 h-72 w-72 bg-forest/10"></div>
      <div class="blob2 absolute -bottom-28 -left-20 h-64 w-64 bg-mustard/15"></div>
    </div>

    <div data-partial="header" class="relative"></div>

    <!-- CONTENIDO -->
    <main class="relative px-5 py-8 lg:px-10 lg:py-12">
      <!-- Móvil: 1 columna. Escritorio: cambiar layout, no estirar. Ej: -->
      <!-- <div class="grid gap-8 lg:grid-cols-[1.1fr_1fr]"> ... </div> -->
      <h1 class="font-display text-[36px] font-bold leading-[1.05] lg:text-[52px]">
        Título de la <span class="text-brick">pantalla</span>
      </h1>
    </main>
  </div>

  <!-- BARRA DE CARRITO (sticky) — hermano del panel, solo donde corresponda -->
  <!-- <div data-partial="cart-bar"></div> -->
</div>

<!-- BOTTOM NAV (solo móvil, fija) -->
<div data-partial="bottom-nav"></div>

<script type="module">
  import { injectPartials } from "/assets/js/ui.js";
  // import { api } from "/assets/js/api.js";
  // import { requireRole } from "/assets/js/auth.js";
  await injectPartials();
</script>
</body>
</html>
