<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mi cuenta · Morfi Center</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Caveat:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

<!-- Dev: Tailwind CDN + config compartida. Prod: /assets/css/tailwind.css -->
<script src="https://cdn.tailwindcss.com"></script>
<script src="/tailwind.config.js"></script>
<link rel="stylesheet" href="/assets/css/base.css" />
</head>
<body class="pb-[84px] font-sans text-bark antialiased lg:pb-0">

<div class="mx-auto max-w-[1200px] px-4 pt-6 lg:py-10">
  <div class="paper relative overflow-hidden rounded-[34px] border border-bark/10">
    <div class="pointer-events-none absolute inset-0 overflow-hidden rounded-[34px]">
      <div class="blob absolute -right-24 -top-24 h-72 w-72 bg-forest/10"></div>
      <div class="blob2 absolute -bottom-28 -left-20 h-64 w-64 bg-mustard/15"></div>
    </div>

    <div data-partial="header" class="relative"></div>

    <div class="relative grid gap-8 px-5 py-8 lg:grid-cols-[1.1fr_1fr] lg:px-10">

      <!-- ═══ IZQUIERDA · datos ═══ -->
      <section>
        <h1 class="font-display text-[28px] font-bold leading-tight lg:text-[36px]">Mi cuenta</h1>
        <p class="mt-1 font-hand text-[16px] text-brick">tus datos, siempre a mano</p>

        <form id="perfil-form" class="mt-6 space-y-4" novalidate>
          <div class="grid gap-4 sm:grid-cols-2">
            <div>
              <label for="first_name" class="mb-1.5 block text-[11px] uppercase tracking-widest text-bark/45">Nombre</label>
              <input id="first_name" name="first_name" type="text" autocomplete="given-name" required
                     class="w-full rounded-xl border-2 border-bark/15 bg-cream px-4 py-3 text-[15px] placeholder-bark/35 focus:border-forest focus:outline-none focus:ring-2 focus:ring-forest/15" />
              <p data-error="first_name" class="mt-1 hidden text-[12px] text-brick"></p>
            </div>
            <div>
              <label for="last_name" class="mb-1.5 block text-[11px] uppercase tracking-widest text-bark/45">Apellido</label>
              <input id="last_name" name="last_name" type="text" autocomplete="family-name" required
                     class="w-full rounded-xl border-2 border-bark/15 bg-cream px-4 py-3 text-[15px] placeholder-bark/35 focus:border-forest focus:outline-none focus:ring-2 focus:ring-forest/15" />
              <p data-error="last_name" class="mt-1 hidden text-[12px] text-brick"></p>
            </div>
          </div>

          <div>
            <label for="email" class="mb-1.5 block text-[11px] uppercase tracking-widest text-bark/45">Email</label>
            <input id="email" type="email" disabled
                   class="w-full cursor-not-allowed rounded-xl border-2 border-bark/10 bg-bark/5 px-4 py-3 text-[15px] text-bark/50" />
            <p class="mt-1 text-[12px] text-bark/40">No se puede editar por acá.</p>
          </div>

          <div>
            <label for="phone" class="mb-1.5 block text-[11px] uppercase tracking-widest text-bark/45">Teléfono</label>
            <input id="phone" name="phone" type="tel" autocomplete="tel"
                   class="w-full rounded-xl border-2 border-bark/15 bg-cream px-4 py-3 text-[15px] placeholder-bark/35 focus:border-forest focus:outline-none focus:ring-2 focus:ring-forest/15"
                   placeholder="11 4444-5555" />
            <p data-error="phone" class="mt-1 hidden text-[12px] text-brick"></p>
          </div>

          <div>
            <span class="mb-1.5 block text-[11px] uppercase tracking-widest text-bark/45">Rol</span>
            <span data-role class="stamp inline-block rounded-md px-2.5 py-1 font-display text-[11px] font-bold uppercase tracking-wide text-brick"></span>
          </div>

          <p data-error="form" class="hidden rounded-xl border-2 border-brick/30 bg-brick/8 px-4 py-3 text-[13px] text-brick" role="alert"></p>
          <p data-success="form" class="hidden rounded-xl border-2 border-forest/25 bg-forest/8 px-4 py-3 text-[13px] text-bark/70" role="status"></p>

          <button type="submit" data-submit
                  class="blob bg-forest px-6 py-2.5 text-[13px] font-semibold text-cream transition hover:bg-bark disabled:cursor-not-allowed disabled:opacity-60">
            Guardar cambios
          </button>
        </form>
      </section>

      <!-- ═══ DERECHA · saldo + direcciones ═══ -->
      <section class="space-y-5">
        <div class="rounded-2xl border-2 border-forest/25 bg-forest/8 p-5">
          <div class="text-[11px] uppercase tracking-widest text-bark/45">Saldo a favor</div>
          <div data-balance class="mt-1 font-display text-[28px] font-bold text-forest">$0</div>
          <p class="mt-2 text-[12px] text-bark/50">Se acumula con cancelaciones. Se puede usar al pagar un pedido.</p>
        </div>

        <div class="rounded-2xl border-2 border-dashed border-bark/20 bg-cream/60 p-5 opacity-70">
          <div class="text-[11px] uppercase tracking-widest text-bark/45">Direcciones</div>
          <p class="mt-2 font-hand text-[16px] text-bark/45">todavía no se pueden cargar</p>
          <p class="mt-1 text-[12px] text-bark/40">Vas a poder guardar tus direcciones de entrega más adelante.</p>
        </div>
      </section>
    </div>
  </div>
</div>

<div data-partial="bottom-nav"></div>

<script type="module" src="/assets/js/pages/perfil.js"></script>
</body>
</html>
